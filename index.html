<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מסלול 12 — יומן אימונים ותזונה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#1B1D21;
    --bg-panel:#232629;
    --bg-panel-2:#2A2D31;
    --line:#383B40;
    --text:#EDEAE2;
    --text-dim:#9A9D9F;
    --brass:#C9A24B;
    --brass-dim:#8A754C;
    --teal:#3E8E90;
    --rust:#C1502E;
    --green:#6E9A5A;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Rubik', sans-serif;
    font-size:15px;
    line-height:1.55;
    min-height:100vh;
  }
  h1,h2,h3,.num-display{
    font-family:'Heebo', sans-serif;
  }
  .app{max-width:920px;margin:0 auto;padding:0 0 60px;}

  /* Header */
  .app-header{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--line);
  }
  .app-header .kicker{
    color:var(--brass);
    font-size:12.5px;
    letter-spacing:.03em;
    margin:0 0 4px;
  }
  .app-header h1{
    font-size:30px;
    font-weight:900;
    margin:0 0 6px;
    letter-spacing:-.01em;
  }
  .app-header p{
    color:var(--text-dim);
    margin:0;
    font-size:13.5px;
    max-width:60ch;
  }

  /* Tabs */
  .tabbar{
    display:flex;
    gap:2px;
    overflow-x:auto;
    padding:0 20px;
    border-bottom:1px solid var(--line);
    background:var(--bg);
    position:sticky;
    top:0;
    z-index:5;
    scrollbar-width:none;
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .tabbtn{
    flex:0 0 auto;
    background:none;
    border:none;
    color:var(--text-dim);
    font-family:'Rubik';
    font-size:14px;
    font-weight:500;
    padding:14px 14px 12px;
    cursor:pointer;
    border-bottom:2px solid transparent;
    white-space:nowrap;
  }
  .tabbtn.active{
    color:var(--text);
    border-bottom-color:var(--brass);
  }

  .tabpanel{padding:22px 20px 0;}
  .hidden{display:none;}

  /* Panels / cards */
  .panel{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
  }
  .panel-title{
    font-size:12px;
    color:var(--text-dim);
    margin:0 0 12px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .accent-strip{
    border-inline-start:3px solid var(--brass);
    padding-inline-start:14px;
  }
  .accent-strip.teal{border-inline-start-color:var(--teal);}
  .accent-strip.rust{border-inline-start-color:var(--rust);}

  /* Hero / today card */
  .hero{
    background:linear-gradient(135deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid var(--line);
    padding:22px 20px;
    margin-bottom:18px;
  }
  .hero .day-label{color:var(--text-dim); font-size:13px; margin:0 0 2px;}
  .hero h2{font-size:26px; margin:0 0 4px; font-weight:900;}
  .hero .sub{color:var(--brass); font-size:13.5px; margin:0 0 14px;}
  .hero-meta{display:flex; gap:22px; flex-wrap:wrap;}
  .hero-meta div{font-size:13px; color:var(--text-dim);}
  .hero-meta strong{display:block; color:var(--text); font-size:17px; font-family:'Heebo'; font-weight:700;}

  /* Exercise rows */
  .exercise{
    border-bottom:1px solid var(--line);
    padding:14px 0;
  }
  .exercise:last-child{border-bottom:none;}
  .exercise-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  .exercise-head h4{margin:0; font-size:15.5px; font-weight:700;}
  .exercise-spec{font-size:12px; color:var(--text-dim);}
  .last-time{font-size:12px; color:var(--brass-dim); margin-bottom:8px;}
  .sets-grid{display:flex; flex-direction:column; gap:6px;}
  .set-row{display:flex; align-items:center; gap:8px;}
  .set-row .set-idx{
    width:22px; color:var(--text-dim); font-size:12.5px; font-family:'Heebo'; flex:0 0 auto;
  }
  .set-row input{
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:var(--radius);
    padding:8px 8px;
    font-size:14px;
    width:100%;
    font-family:'Rubik';
  }
  .set-row input:focus{outline:1px solid var(--brass); border-color:var(--brass);}
  .set-row span.unit{font-size:11.5px; color:var(--text-dim); flex:0 0 30px;}
  .row-remove{
    background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:16px; flex:0 0 auto; padding:0 4px;
  }
  .row-remove:hover{color:var(--rust);}
  .add-set-btn{
    margin-top:8px;
    background:none;
    border:1px dashed var(--line);
    color:var(--text-dim);
    font-size:12.5px;
    padding:6px 10px;
    cursor:pointer;
    border-radius:var(--radius);
  }
  .add-set-btn:hover{border-color:var(--brass); color:var(--brass);}

  button.primary{
    background:var(--brass);
    color:#1B1D21;
    border:none;
    font-family:'Heebo';
    font-weight:700;
    font-size:14px;
    padding:11px 22px;
    border-radius:var(--radius);
    cursor:pointer;
  }
  button.primary:hover{background:#dcb45c;}
  button.secondary{
    background:none;
    border:1px solid var(--line);
    color:var(--text);
    font-size:13.5px;
    padding:9px 16px;
    border-radius:var(--radius);
    cursor:pointer;
    font-family:'Rubik';
  }
  button.secondary:hover{border-color:var(--text-dim);}
  .save-row{display:flex; align-items:center; gap:12px; margin-top:16px;}
  .save-msg{font-size:12.5px; color:var(--green);}

  /* Tables */
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th,td{padding:9px 8px; text-align:right; border-bottom:1px solid var(--line);}
  th{color:var(--text-dim); font-weight:500; font-size:12px;}
  tr.current-week td{background:rgba(201,162,75,0.08);}
  tr.current-week td:first-child{color:var(--brass); font-weight:700;}
  td input{
    background:var(--bg); border:1px solid var(--line); color:var(--text);
    border-radius:var(--radius); padding:6px; font-size:13px; width:100%; font-family:'Rubik';
  }

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  @media (max-width:600px){ .grid2, .grid3{grid-template-columns:1fr;} }

  label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:4px;}
  select, input[type=number], input[type=date], input[type=text]{
    background:var(--bg); border:1px solid var(--line); color:var(--text);
    border-radius:var(--radius); padding:9px 10px; font-size:14px; width:100%; font-family:'Rubik';
  }
  .field{margin-bottom:12px;}

  /* Nutrition */
  .macro-bar-wrap{margin-bottom:14px;}
  .macro-bar-label{display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-dim); margin-bottom:4px;}
  .macro-bar-track{height:7px; background:var(--bg); border-radius:6px; overflow:hidden;}
  .macro-bar-fill{height:100%; border-radius:6px;}
  .food-list{max-height:230px; overflow-y:auto; border:1px solid var(--line); margin-bottom:10px;}
  .food-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 10px; border-bottom:1px solid var(--line); cursor:pointer; font-size:13.5px;
  }
  .food-row:hover{background:var(--bg-panel-2);}
  .food-row:last-child{border-bottom:none;}
  .food-row .fname{font-weight:500;}
  .food-row .fmacro{color:var(--text-dim); font-size:12px;}
  .logged-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px;
  }
  .logged-item:last-child{border-bottom:none;}
  .empty-note{color:var(--text-dim); font-size:13px; padding:14px 0; text-align:center;}
  .badge{
    display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; background:var(--bg-panel-2); color:var(--text-dim); border:1px solid var(--line);
  }
  .rest-msg{padding:30px 10px; text-align:center; color:var(--text-dim);}
  .rest-msg .big{font-size:40px; margin-bottom:8px;}
  canvas{max-width:100%;}
  .chart-wrap{position:relative; height:220px;}
  .foot-note{font-size:11.5px; color:var(--text-dim); margin-top:6px;}
</style>
</head>
<body>
<div class="app">

  <div class="app-header">
    <p class="kicker">תוכנית אימונים · 12 שבועות</p>
    <h1>מסלול 12</h1>
    <p>יומן אימונים, ריצה ושחייה, מעקב התקדמות ותזונה — הכול לפי התוכנית שלך, במקום אחד.</p>
    <p id="sync-status" style="font-size:12px; color:var(--text-dim); margin-top:10px;">מתחבר לענן...</p>
  </div>
  <div id="setup-banner" class="hidden" style="margin:16px 20px 0; padding:16px; border:1px solid var(--rust); background:rgba(193,80,46,0.08); border-radius:2px; font-size:13px; color:var(--text);"></div>

  <div class="tabbar" id="tabbar">
    <button class="tabbtn active" data-tab="today">היום</button>

    <button class="tabbtn" data-tab="nutrition">תזונה</button>

  </div>

  <div class="tabpanel" id="tab-today"></div>
  <div class="tabpanel hidden" id="tab-plan"></div>
  <div class="tabpanel hidden" id="tab-cardio"></div>
  <div class="tabpanel hidden" id="tab-progress"></div>
  <div class="tabpanel hidden" id="tab-nutrition"></div>
  <div class="tabpanel hidden" id="tab-settings"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getAuth, signInAnonymously, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {
  initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager,
  doc, getDoc, setDoc, collection, query, where, getDocs, documentId
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

/* ============================= FIREBASE SETUP ============================= */

const firebaseConfig = {
  apiKey: "AIzaSyC1u6V69o5RV8WCLCD-uFQJDnMtg82PPRM",
  authDomain: "workout-3ecef.firebaseapp.com",
  projectId: "workout-3ecef",
  storageBucket: "workout-3ecef.firebasestorage.app",
  messagingSenderId: "800129315761",
  appId: "1:800129315761:web:bc4ab50bdf038a80280390",
  measurementId: "G-TLW5G685Y5"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);

// Enable offline persistence: reads/writes are cached on the device (IndexedDB)
// and work with no internet connection, then sync automatically to Firestore
// once connectivity comes back. Falls back to the plain (online-only) client
// if the browser doesn't support it (e.g. private browsing in some browsers).
let db;
try {
  db = initializeFirestore(fbApp, {
    localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
  });
} catch (e) {
  console.warn('Firestore offline persistence unavailable, falling back to online-only mode', e);
  db = getFirestore(fbApp);
}

let currentUser = null;
let authFailed = false;

function updateConnectivityStatus(){
  const statusEl = document.getElementById('sync-status');
  if (!statusEl || !currentUser) return;
  if (navigator.onLine) {
    statusEl.textContent = 'מחובר לענן ✓ — הנתונים שלך נשמרים ב-Firestore';
  } else {
    statusEl.textContent = 'אין חיבור לאינטרנט כרגע — עובד במצב אופליין, הנתונים נשמרים במכשיר ויסונכרנו לענן אוטומטית כשהחיבור יחזור';
  }
}
window.addEventListener('online', updateConnectivityStatus);
window.addEventListener('offline', updateConnectivityStatus);

const authReady = new Promise((resolve, reject) => {
  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      updateConnectivityStatus();
      resolve(user);
    } else {
      signInAnonymously(auth).catch((err) => {
        authFailed = true;
        reject(err);
      });
    }
  }, (err) => { authFailed = true; reject(err); });
});

function showSetupBanner(err){
  const banner = document.getElementById('setup-banner');
  const statusEl = document.getElementById('sync-status');
  if (statusEl) statusEl.textContent = 'יש בעיה בחיבור לענן — ראה הוראות למטה';
  if (!banner) return;
  banner.classList.remove('hidden');
  const code = err && err.code ? err.code : 'שגיאה לא ידועה';
  const msg = err && err.message ? err.message : '';
  banner.innerHTML = `<strong>הפעולה מול Firebase נכשלה</strong> (${code}).<br>
    <span style="color:var(--text-dim); font-size:12px;">${msg}</span><br><br>
    כדי שהאפליקציה תוכל לשמור ולקרוא נתונים, יש להגדיר בפרויקט <code>workout-3ecef</code> בקונסולת Firebase:<br>
    1. Authentication → Sign-in method → הפעלת <strong>Anonymous</strong>.<br>
    2. Firestore Database → <strong>ליצור מסד נתונים</strong> אם עוד לא קיים (זו הסיבה השכיחה ביותר לתקלה — בפרויקט חדש אין Firestore עד שיוצרים אותו ידנית).<br>
    3. Firestore → Rules → הגדרת הכלל הבא כדי שכל משתמש יראה רק את הנתונים שלו, ואז לחיצה על <strong>Publish</strong>:<br>
    <code style="display:block; white-space:pre; background:var(--bg); padding:8px; margin-top:6px; border-radius:2px;">rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /users/{userId}/{document=**} {
      allow read, write: if request.auth != null && request.auth.uid == userId;
    }
  }
}</code>
    לאחר ההגדרה, רענן את הדף ונסה שוב.`;
}

let firestoreErrorShown = false;
function reportFirestoreError(err){
  console.error('Firestore error', err);
  if(!firestoreErrorShown){
    firestoreErrorShown = true;
    showSetupBanner(err);
  }
}

/* ============================= STORAGE HELPERS ============================= */

async function storeGet(key){
  try{
    await authReady;
    const ref = doc(db, 'users', currentUser.uid, 'kv', key);
    const snap = await getDoc(ref);
    return snap.exists() ? snap.data().value : null;
  }catch(e){ reportFirestoreError(e); return null; }
}
async function storeSet(key, value){
  try{
    await authReady;
    const ref = doc(db, 'users', currentUser.uid, 'kv', key);
    // With offline persistence, this write lands in the local cache instantly
    // and syncs to Firestore in the background (now, or once back online).
    // We don't await the server round-trip here, so "saved" feedback in the
    // UI stays instant instead of hanging while offline.
    setDoc(ref, {value, updatedAt: Date.now()}).catch(e => reportFirestoreError(e));
    return true;
  }catch(e){ reportFirestoreError(e); return false; }
}
async function storeList(prefix){
  try{
    await authReady;
    const colRef = collection(db, 'users', currentUser.uid, 'kv');
    const q = prefix
      ? query(colRef, where(documentId(), '>=', prefix), where(documentId(), '<', prefix + '\uf8ff'))
      : query(colRef);
    const snap = await getDocs(q);
    return snap.docs.map(d => d.id);
  }catch(e){ reportFirestoreError(e); return []; }
}

function todayStr(d){
  d = d || new Date();
  return d.toISOString().slice(0,10);
}
function fmtDateHe(dstr){
  const d = new Date(dstr+'T00:00:00');
  return d.toLocaleDateString('he-IL', {day:'2-digit', month:'2-digit', year:'numeric'});
}

function getProgramWeek(){
  const start = new Date(state.settings.startDate+'T00:00:00');
  const now = new Date(todayStr()+'T00:00:00');
  const diffDays = Math.round((now-start)/86400000);
  let week = Math.floor(diffDays/7)+1;
  if(week<1) week=1;
  if(week>12) week=12;
  return week;
}

async function findLastSet(exerciseName, excludeDate){
  const keys = await storeList('workout:');
  let best = null, bestDate = null;
  for(const k of keys){
    const dateStr = k.replace('workout:','');
    if(dateStr === excludeDate) continue;
    const data = await storeGet(k);
    if(!data || !data.exercises) continue;
    const ex = data.exercises.find(e=>e.name===exerciseName);
    if(ex && ex.sets && ex.sets.length){
      if(!bestDate || dateStr > bestDate){
        bestDate = dateStr;
        best = ex.sets;
      }
    }
  }
  return best ? {date:bestDate, sets:best} : null;
}

function phaseForWeek(week){
  if(week<=4) return 'בניית בסיס';
  if(week===5) return 'Deload';
  if(week<=9) return 'בניית שריר';
  return 'Push';
}

  // Lift progress chart
  const allExerciseNames = Array.from(new Set([...FULL_BODY.A, ...FULL_BODY.B].map(e=>e.name)));

  liftSelect.innerHTML = allExerciseNames.map(n=>`<option value="${escAttr(n)}">${n}</option>`).join('');

    const workoutKeys = await storeList('workout:');

    for(const k of workoutKeys){

async function getAllFoods(){
  const custom = (await storeGet('customFoods')) || [];
  return [...BUILTIN_FOODS, ...custom];
}

function computeTargets(settings, latestWeight){
  const w = latestWeight || settings.weightKg;
  const h = settings.heightCm;
  const a = settings.age;
  // Mifflin-St Jeor (male)
  const bmr = 10*w + 6.25*h - 5*a + 5;
  const actFactor = (ACTIVITY_FACTORS.find(x=>x.key===settings.activityLevel) || ACTIVITY_FACTORS[1]).factor;
  const tdee = bmr*actFactor;
  const goalObj = GOALS.find(g=>g.key===settings.goal) || GOALS[1];
  const targetKcal = Math.round(tdee*(1+goalObj.pct));
  const proteinG = Math.round(w*2.0);
  const fatG = Math.round((targetKcal*0.25)/9);
  const proteinKcal = proteinG*4, fatKcal = fatG*9;
  const carbG = Math.max(0, Math.round((targetKcal - proteinKcal - fatKcal)/4));
  return {bmr:Math.round(bmr), tdee:Math.round(tdee), targetKcal, proteinG, fatG, carbG, goalLabel: goalObj.label};
}

        </select>
      </div>
      <div class="field"><label>איך תרצה/י להזין את הערכים</label>
        <select id="new-food-basis">
          <option value="100">לפי 100 גרם/מ"ל (כמו על תווית מזון)</option>

      יעד החלבון נקבע ל-2 גרם לכל ק"ג משקל גוף, השומן ל-25% מהקלוריות, והשאר פחמימות.
      זו נקודת פתיחה סבירה — אפשר להתאים לפי התקדמות בפועל.
    </p>
  </div>`;

  document.getElementById('save-settings-btn').addEventListener('click', async ()=>{
    const newSettings = {
      startDate: document.getElementById('set-startdate').value,
      age: parseInt(document.getElementById('set-age').value)||30,
      heightCm: parseFloat(document.getElementById('set-height').value)||178,
      weightKg: parseFloat(document.getElementById('set-weight').value)||83,
      activityLevel: document.getElementById('set-activity').value,
      goal: document.getElementById('set-goal').value,
    };
    const ok = await storeSet('settings', newSettings);
    state.settings = newSettings;
    const msg = document.getElementById('save-settings-msg');
    msg.textContent = ok ? '✓ נשמר' : 'שגיאה בשמירה';
    setTimeout(()=>{ if(msg) msg.textContent=''; }, 2000);
  });
}

(async function init(){
  try{
    await authReady;
  }catch(err){
    showSetupBanner(err);
    return;
  }
  await loadSettings();
  renderToday();
})();
</script>
